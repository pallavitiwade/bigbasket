




<div class="fruit-page">
  <!-- Fruit Cards -->
  <div class="container">
    <div class="row">

      <div
        class="col-lg-3 col-md-4 col-sm-6 mb-4 mt-4"
        *ngFor="let fruit of fruits"
        
      >
        <div class="fruit-card">

          <!-- Image -->
          <div class="fruit-image">
            <img
              [src]="fruit.image"
              [alt]="fruit.name"
            />
          </div>

          <!-- Content -->
          <div class="fruit-content">

            <div class="fruit-top">
              <h3>{{ fruit.name }}</h3>

              <span class="category">
                {{ fruit.category }}
              </span>
            </div>

            <p class="description">
              {{ fruit.description }}
            </p>

            <div class="fruit-info">
              <div>
                <span class="label">Color</span>
                <span>{{ fruit.color }}</span>
              </div>

              <div>
                <span class="label">Origin</span>
                <span>{{ fruit.origin }}</span>
              </div>
            </div>

            <div class="fruit-bottom">

              <div class="price">
                ₹{{ fruit.price }}
              </div>

              <div class="quantity">
                {{ fruit.quantity }}
              </div>

            </div>

            <button
               mat-raised-button
      color="light" class="shop-button btn-block" 
            >
             Buy Now
            </button>

          </div>

        </div>
      </div>

    </div>
  </div>

</div>

<div class="fruit-container">

  <div class="fruit-row" *ngFor="let fruit of fruitsBox">

    <!-- Image -->
    <div class="fruit-image">
      <img
        [src]="fruit.img"
        [alt]="fruit.name">
    </div>

    <!-- Information -->
    <div class="fruit-info">

      <h3>{{ fruit.name }}</h3>

      <p class="information">
        {{ fruit.information }}
      </p>

      <div class="fruit-details">

        <span>
          <strong>ID:</strong>
          {{ fruit.id }}
        </span>

        <span>
          <strong>Quantity:</strong>
          {{ fruit.quantity }}
        </span>

        <span>
          <strong>Price:</strong>
          ₹{{ fruit.price }}
        </span>


      </div>

    </div>
        <button class="add-btn text-center" routerLink="/cart">Add to cart</button>

  </div>


</div>
