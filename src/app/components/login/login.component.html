
<div class="registration-page">

  <div class="overlay"></div>

  <div class="registration-card">

    <div class="form-header">
      <h1>Login</h1>
      <p>Register here to book your FruitBasket</p>
    </div>

    <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()">

      <!-- Name -->
      <div class="form-group">

        <label for="name">Name</label>

        <input
          id="name"
          type="text"
          formControlName="name"
          placeholder=" "
        />

        <div
          class="error"
          *ngIf="
            registrationForm.get('name')?.touched &&
            registrationForm.get('name')?.invalid
          "
        >
          <span *ngIf="registrationForm.get('name')?.errors?.['required']">
            Name is required
          </span>

          <span *ngIf="registrationForm.get('name')?.errors?.['minlength']">
            Name must contain at least 10 characters
          </span>
        </div>

      </div>
      <div class="form-group">

        <label for="Number">Number</label>

        <input
          id="Number"
          type="tel"
          formControlName="Number"
          placeholder=" "
        />

        <div
          class="error"
          *ngIf="
            registrationForm.get('Number')?.touched &&
            registrationForm.get('Number')?.invalid
          "
        >
          <span *ngIf="registrationForm.get('Number')?.errors?.['required']">
            Number is required
          </span>

          <span *ngIf="registrationForm.get('Number')?.errors?.['minlength']">
            Number must contain at least 10 digits
          </span>
        </div>

      </div>
      <div class="form-group">

        <label for="email">Email</label>

        <input
          id="email"
          type="text"
          formControlName="email"
          placeholder=" "
        />

        <div
          class="error"
          *ngIf="
            registrationForm.get('email')?.touched &&
            registrationForm.get('email')?.invalid
          "
        >
          <span *ngIf="registrationForm.get('email')?.errors?.['required']">
         Email is required
          </span>

          <span *ngIf="registrationForm.get('email')?.errors?.['minlength']">
                        Enter a valid Email Address

          </span>
        </div>

      </div>



      <!-- Submit -->
      <div class="button-container">

        <button
          type="submit"
          class="submit-btn"
          [disabled]="registrationForm.invalid"
        >
          Submit
        </button>

      </div>

    </form>

  </div>

</div>
